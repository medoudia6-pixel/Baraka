<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baraka</title>
<style>
:root{--tx:#eef4ff;--mut:#8ea3c9;--line:rgba(147,197,253,.16);--pri:#3b82f6;--hi:#93c5fd;--bad:#f87171;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#060b1f}
body{background:radial-gradient(circle at 85% -5%,rgba(59,130,246,.38),transparent 45%),radial-gradient(circle at 0% 60%,rgba(29,78,216,.18),transparent 45%),#060b1f;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(147,197,253,.12) 1px,transparent 1px);background-size:22px 22px;opacity:.6}
main{position:relative;max-width:520px;margin:0 auto;padding:18px 16px 150px}
h1{font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(145deg,#1e3a8a,#2563eb);border:1px solid rgba(147,197,253,.4);box-shadow:0 0 18px rgba(59,130,246,.55)}
.card{background:linear-gradient(145deg,rgba(59,130,246,.14),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;backdrop-filter:blur(8px);box-shadow:0 0 34px rgba(37,99,235,.12)}
.lbl{font-size:13px;color:var(--mut)}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;margin-top:4px;background:linear-gradient(180deg,#fff,var(--hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.big.neg{background:none;color:var(--bad)}
.row{display:flex;gap:12px}.row>.card{flex:1;margin-bottom:12px}
.mid{font-size:22px;font-weight:700;margin-top:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(145deg,#2563eb,#3b82f6);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;box-shadow:0 0 22px rgba(59,130,246,.4)}
.ghost{background:rgba(59,130,246,.1);color:var(--hi);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(6,11,31,.85);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:3}
nav .in{display:flex;max-width:520px;width:100%;gap:2px;align-items:center}
nav .tab{flex:1;background:none;border:0;color:var(--mut);padding:10px 2px;font-size:13px;font-weight:600;border-radius:10px}
nav .tab.on{color:#fff;background:rgba(59,130,246,.2)}
nav .add{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#1d4ed8,#3b82f6);color:#fff;border:1px solid rgba(147,197,253,.5);font-size:28px;font-weight:600;margin:-28px 6px 0;box-shadow:0 0 26px rgba(59,130,246,.65)}
.sheet{position:fixed;inset:0;background:rgba(2,6,23,.7);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.show{display:flex}
.pane{background:#0b1430;border:1px solid var(--line);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.pane h2{margin:0 0 12px;font-size:18px}
.opt{display:block;width:100%;text-align:left;background:rgba(59,130,246,.08);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--mut);margin-top:2px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
.stars{color:#93c5fd;letter-spacing:2px}
.pick button{background:none;border:0;font-size:30px;color:var(--mut);padding:0 4px}
.pick button.on{color:#93c5fd}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,40px)}}
@keyframes glow{0%,100%{box-shadow:0 0 16px rgba(59,130,246,.45)}50%{box-shadow:0 0 30px rgba(96,165,250,.85)}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.card{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
#v>*:nth-child(2){animation-delay:.08s}#v>*:nth-child(3){animation-delay:.16s}#v>*:nth-child(4){animation-delay:.24s}
body::after{content:"";position:fixed;width:340px;height:340px;right:-120px;top:22%;border-radius:50%;background:rgba(59,130,246,.2);filter:blur(80px);animation:drift 14s ease-in-out infinite;pointer-events:none}
.logo{animation:glow 3.5s ease-in-out infinite}
.pane{animation:slide .3s ease both}
button:active{transform:scale(.96)}
#ai{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:1px solid rgba(147,197,253,.5);background:linear-gradient(145deg,#0f2a6b,#2563eb);color:#fff;font-size:22px;display:none;z-index:4;animation:glow 3s ease-in-out infinite}
.msgs{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px;max-height:44vh;overflow:auto}
.b{padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;max-width:88%;animation:up .3s both;white-space:pre-wrap}
.b.u{align-self:flex-end;background:linear-gradient(145deg,#1d4ed8,#3b82f6)}
.b.a{align-self:flex-start;background:rgba(59,130,246,.12);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#st{font-size:18px;padding:6px 11px}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(147,197,253,.14) 50%,transparent 70%);transform:translateX(-100%);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes grow{from{transform:scaleY(0)}}
.bars{display:flex;gap:8px;align-items:flex-end;height:100px;margin-top:10px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--mut)}
.bb{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#93c5fd,#2563eb);box-shadow:0 0 14px rgba(59,130,246,.4);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.fl{position:relative;height:140px;overflow:hidden;margin-top:6px;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.fb{position:absolute;bottom:0;max-width:78%;padding:10px 12px;border-radius:14px;font-size:13px;background:rgba(59,130,246,.14);border:1px solid var(--line);backdrop-filter:blur(8px);animation:fup 6s ease-in-out both}
@keyframes fup{0%{transform:translateY(40px);opacity:0}20%,75%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.chips button.on{background:rgba(59,130,246,.4);color:#fff}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-4px)}}
#ai{animation:glow 3s ease-in-out infinite,bob 3.5s ease-in-out infinite;display:none}
#aih{position:fixed;right:76px;bottom:calc(94px + env(safe-area-inset-bottom,0px));display:none;z-index:4;padding:8px 12px;border-radius:14px 14px 4px 14px;background:rgba(59,130,246,.22);border:1px solid rgba(147,197,253,.45);backdrop-filter:blur(8px);font-size:13px;font-weight:600;animation:up .6s .6s both;pointer-events:none}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
#auth{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 85% -5%,rgba(59,130,246,.38),transparent 45%),#060b1f}.ap{width:100%;max-width:400px;text-align:center}.ap label{text-align:left}.ap .logo{width:48px;height:48px;font-size:24px;margin:0 auto 14px}
#av{width:38px;height:38px;border-radius:50%;border:1px solid rgba(147,197,253,.5);background:linear-gradient(145deg,#1d4ed8,#3b82f6) center/cover;color:#fff;font-weight:700;font-size:15px;padding:0;display:none}
.pg{height:8px;border-radius:9px;background:rgba(147,197,253,.12);overflow:hidden}.pg i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2563eb,#93c5fd);box-shadow:0 0 12px rgba(59,130,246,.6);transition:width .8s}.ghost:disabled{opacity:.5}
.tile{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,rgba(59,130,246,.28),rgba(37,99,235,.08));border:1px solid var(--line);box-shadow:0 0 18px rgba(59,130,246,.25)}.tile svg{animation:bob 4s ease-in-out infinite}
.greet{margin:2px 2px 16px}.greet .gh{font-size:24px;font-weight:800;letter-spacing:-.5px}.gq{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.pp{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}@keyframes breath{50%{transform:scaleY(1.05)}}
.co{transform-box:fill-box;transform-origin:center;animation:coin 2.2s ease-in-out infinite}@keyframes coin{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-3px) scaleX(.25)}50%{transform:translateY(0) scaleX(1)}}
.ar{animation:drop 1.4s ease-in-out infinite}@keyframes drop{0%{transform:translateY(-2px);opacity:.3}60%{opacity:1}100%{transform:translateY(3px);opacity:.3}}
.arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.2s ease-in-out infinite}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.ln{stroke-dasharray:14;animation:wr 3s ease-in-out infinite}@keyframes wr{0%{stroke-dashoffset:14}50%,100%{stroke-dashoffset:0}}
.ant{transform-box:fill-box;transform-origin:center;animation:pls 1.6s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.8)}}
#ai svg{transform-origin:50% 90%;animation:rock 3s ease-in-out infinite}@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.hx{transform-box:view-box;transform-origin:24px 25px}
.nod{animation:nod 2.6s ease-in-out infinite}@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(5deg)}60%{transform:rotate(-2deg)}}
.shake{animation:shake 3.6s ease-in-out infinite}@keyframes shake{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}}
.hop{animation:hopx 2.2s ease-in-out infinite}@keyframes hopx{0%,45%,100%{transform:translateY(0)}20%{transform:translateY(-3px)}}
.read{animation:read 3.2s ease-in-out infinite}@keyframes read{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg) translateY(1px)}}
.tilt{animation:tilt 2.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sw{animation:sweat 2.4s ease-in infinite}@keyframes sweat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 1.8s ease-in-out infinite}@keyframes twk{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.look{animation:look 6s ease-in-out infinite}@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,60%{transform:translate(1.2px,0)}70%,85%{transform:translate(-1.2px,.4px)}}
.mo{transform-box:fill-box;transform-origin:center top;animation:smile 6s ease-in-out infinite}@keyframes smile{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.15,1.7)}}
.ea,.eb{transform-box:fill-box;transform-origin:center;animation:ear 2.6s ease-in-out infinite}.eb{animation-delay:1.3s}@keyframes ear{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
.talk .mo{animation:talk .35s ease-in-out infinite}@keyframes talk{50%{transform:scale(.8,2.2)}}
.talk .look{animation:look 1.2s ease-in-out infinite}.talk .ant{animation-duration:.5s}
#ai:active svg{animation:hop2 .5s ease}@keyframes hop2{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-8px) rotate(12deg)}100%{transform:none}}
.td{display:inline-flex;gap:4px;align-items:center;height:14px}.td i{width:6px;height:6px;border-radius:50%;background:#93c5fd;animation:tdb 1s ease-in-out infinite}.td i:nth-child(2){animation-delay:.15s}.td i:nth-child(3){animation-delay:.3s}@keyframes tdb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

#ai{width:auto;height:54px;border-radius:27px;padding:0 16px 0 12px;gap:8px;align-items:center;font-size:14px;font-weight:700;right:14px}
#aih{right:14px;bottom:calc(146px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 4px 14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
<div class="top"><h1 style="margin:0"><span class="logo">B</span><span><span id="bn">Baraka</span><small class="sub" id="gr" style="display:block;font-weight:400;margin:0"></small></span></h1><div style="display:flex;gap:8px;align-items:center"><button class="ghost" id="st" aria-label="Paramètres">⚙</button><button id="av" aria-label="Compte"></button></div></div>
<div id="v"></div>
<p class="note">Tes données sont enregistrées dans ton compte.</p>
</main>
<nav><div class="in">
<button class="tab" data-t="home">Accueil</button>
<button class="tab" data-t="people">Dettes</button>
<button class="add" id="plus" aria-label="Ajouter">+</button>
<button class="tab" data-t="stock">Stock</button>
<button class="tab" data-t="avis">Avis</button>
<button class="tab" data-t="hist">Historique</button>
</div></nav>
<div id="auth"><div class="ap"><div class="logo">B</div><h2>Baraka</h2><label>Adresse e-mail</label><input id="ae" type="email" autocomplete="email"><label>Mot de passe</label><input id="ap" type="password" autocomplete="current-password"><div class="sub" id="am" style="margin-top:8px;min-height:16px"></div><button class="btn" id="a1" style="width:100%;margin-top:14px">Se connecter</button><button class="ghost" id="a2" style="width:100%;margin-top:10px">Créer un compte</button></div></div>
<div class="sheet" id="sh"><div class="pane" id="pn"></div></div>
<div id="aih">Une question ? Touche ici</div>
<button id="ai" aria-label="Baraka AI">✦</button>
<datalist id="dl"></datalist>
<script>
var KEY="kooma-v2",tx=[],rv=[],showRv=true,tab="home",lang="fr",cur="XOF",biz="",CUR={XOF:["F CFA","s"],EUR:["€","s"],USD:["$","p"],GBP:["£","p"],MAD:["MAD","s"],XAF:["XAF","s"],GNF:["GNF","s"],MRU:["MRU","s"],GMD:["GMD","s"],GHS:["GHS","s"],NGN:["NGN","s"],KES:["KES","s"],TZS:["TZS","s"],UGX:["UGX","s"],RWF:["RWF","s"],ETB:["ETB","s"],ZAR:["ZAR","s"],EGP:["EGP","s"],DZD:["DZD","s"],TND:["TND","s"],CDF:["CDF","s"],MGA:["MGA","s"],MUR:["MUR","s"]};
try{tx=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tx=[]}
try{rv=JSON.parse(localStorage.getItem("kooma-avis")||"[]")}catch(e){rv=[]}
try{showRv=localStorage.getItem("kooma-showavis")!=="0"}catch(e){}
var stk=[];try{stk=JSON.parse(localStorage.getItem("baraka-stock")||"[]")}catch(e){}
function save(){setTimeout(cloudSave,0);try{localStorage.setItem("baraka-stock",JSON.stringify(stk));localStorage.setItem(KEY,JSON.stringify(tx));localStorage.setItem("kooma-avis",JSON.stringify(rv));localStorage.setItem("kooma-showavis",showRv?"1":"0")}catch(e){}}
function LOC(){return{fr:"fr-FR",en:"en-US",es:"es-ES",wo:"fr-FR",pt:"pt-PT",sw:"sw-KE"}[lang]}
function F(n){var c=CUR[cur]||CUR.XOF,d=ZD.indexOf(cur)>=0?0:2,s=(n/RT()).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});return c[1]==="p"?c[0]+s:s+" "+c[0]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(n){return"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function calc(){
var r={profit:0,owed:0,debt:0,cash:0,cl:{},su:{}};
tx.forEach(function(t){
if(t.type==="sale"){r.profit+=(Number(t.amount)||0)-(Number(t.cost)||0);r.cash+=Number(t.paid)||0;var d=Math.max(0,(Number(t.amount)||0)-(Number(t.paid)||0));if(d){var k=t.party||"Client non identifié";r.cl[k]=(r.cl[k]||0)+d}}
else if(t.type==="expense"){r.profit-=Number(t.amount)||0;r.cash-=Number(t.amount)||0}
else if(t.type==="pay_in"){r.cash+=Number(t.amount)||0;if(t.party)r.cl[t.party]=(r.cl[t.party]||0)-(Number(t.amount)||0)}
else if(t.type==="buy_credit"){if(t.party)r.su[t.party]=(r.su[t.party]||0)+(Number(t.amount)||0)}
else if(t.type==="pay_out"){r.cash-=Number(t.amount)||0;if(t.party)r.su[t.party]=(r.su[t.party]||0)-(Number(t.amount)||0)}
});
Object.keys(r.cl).forEach(function(k){r.cl[k]=Math.max(0,r.cl[k]);r.owed+=r.cl[k]});
Object.keys(r.su).forEach(function(k){r.su[k]=Math.max(0,r.su[k]);r.debt+=r.su[k]});
return r}
function render(){
var r=calc(),h="";
document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});
if(tab==="home"){
h+=greet();h+='<div class="card hero"><div class="tile" style="position:absolute;right:14px;top:14px;width:46px;height:46px">'+fig("sell",32)+'</div><div class="lbl">Mon bénéfice</div><div class="big'+(r.profit<0?" neg":"")+'">'+F(r.profit)+'</div><div class="sub">Ventes moins coût des produits et dépenses</div></div>';
h+='<div class="row"><div class="card"><div class="lbl">Mes clients me doivent</div><div class="mid">'+F(r.owed)+'</div></div><div class="card"><div class="lbl">Je dois</div><div class="mid">'+F(r.debt)+'</div></div></div>';
h+='<div class="card"><div class="lbl">Mouvement net de caisse enregistré</div><div class="mid'+(r.cash<0?' neg':'')+'">'+F(r.cash)+'</div><div class="sub">Encaissements moins dépenses et paiements fournisseurs, depuis le début du suivi. Ce n’est pas forcément le solde réel de ta caisse.</div></div>';
h+=stkAlert()+todayReport()+bars()+chals();if(!tx.length)h+='<div class="empty"><div class="tile" style="margin:0 auto 10px;width:64px;height:64px">'+fig("wave",44)+'</div>Appuie sur + pour enregistrer ta première vente.</div>';h+='<div class="fl" id="fl"></div>';
}else if(tab==="people"){
h+=block("Clients qui me doivent",r.cl,"pay_in","Encaisser");
h+=block("Fournisseurs à qui je dois",r.su,"pay_out","Payer");
}else if(tab==="stock"){h+=stockView();
}else if(tab==="avis"){
var avg=rv.length?rv.reduce(function(a,x){return a+x.n},0)/rv.length:0;
h+='<div class="card"><div class="hd"><div><div class="lbl">Avis des utilisateurs</div>'+(rv.length?'<div class="mid">'+avg.toFixed(1)+' <span class="stars">'+stars(Math.round(avg))+'</span></div><div class="sub">'+rv.length+' avis</div>':'<div class="sub" style="margin-top:6px">Aucun avis pour le moment</div>')+'</div><button class="ghost" id="tg">'+(showRv?"Masquer":"Afficher")+'</button></div></div>';
if(showRv){
h+='<button class="btn" style="width:100%;margin-bottom:12px" id="giv">Donner mon avis</button>';
if(rv.length){h+='<div class="card">';rv.slice().reverse().forEach(function(x){
h+='<div class="item"><div><div class="stars">'+stars(x.n)+'</div><div>'+esc(x.c)+'</div><div class="sub">'+esc(x.name||"Anonyme")+' · '+new Date(x.id).toLocaleDateString(LOC())+'</div></div><button class="ghost" onclick="delRv('+x.id+')">✕</button></div>'});h+='</div>'}
}else h+='<div class="empty">Les commentaires sont masqués. Tu peux les réafficher quand tu veux.</div>';
}else{
